.upn-sub{color:#8a8587;font-size:.85rem;margin:6px 0 0}
`;
function startGame(root) {

  root.appendChild(host);

    beep(659, 0.12, "square", 0.05, 0.12);
    beep(784, 0.12, "square", 0.05, 0.24);
    beep(1046, 0.3, "square", 0.05, 0.36);

  function obj() {

    else if (st === "crisis") els.obj.textContent = INC[order[cur]].a + "  (incidente " + (cur + 1) + " de 4)";

  function hud() {
